<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הודעות שלוחה 1 - ממשק אימות וצ'אט</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #e5ddd5;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        #auth-container {
            width: 100%;
            max-width: 400px;
            background-color: white;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #auth-container h2 {
            color: #075e54;
            margin-bottom: 10px;
        }
        .auth-btn {
            background-color: #128c7e;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }
        .auth-btn:hover {
            background-color: #075e54;
        }
        .auth-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .auth-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 10px;
        }
        #auth-status {
            font-size: 14px;
            color: #555;
            min-height: 20px;
        }
        .error-text {
            color: #d32f2f;
            font-size: 14px;
            display: none;
            margin-top: 5px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
            display: none;
            flex-direction: column;
            height: 100%;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .chat-header {
            background-color: #075e54;
            color: white;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }
        .chat-header-icon {
            width: 40px;
            height: 40px;
            background-color: #128c7e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message-bubble {
            background-color: #ffffff;
            padding: 10px 15px;
            border-radius: 15px;
            border-top-right-radius: 0;
            max-width: 85%;
            min-width: 300px;
            align-self: flex-start;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message-bubble::before {
            content: "";
            position: absolute;
            top: 0;
            right: -10px;
            width: 0;
            height: 0;
            border-left: 10px solid #ffffff;
            border-bottom: 10px solid transparent;
        }
        .message-title {
            font-size: 14px;
            color: #128c7e;
            font-weight: bold;
        }
        .message-audio {
            width: 100%;
            height: 45px;
            outline: none;
        }
        .status-message {
            text-align: center;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            margin: 20px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

    <!-- מסך אימות -->
    <div id="auth-container">
        <h2>כניסה למערכת</h2>
        <div id="auth-status"></div>

        <!-- שלב 1: אימות טלפון -->
        <div id="step-phone">
            <input type="tel" id="phone-input" class="auth-input" placeholder="הכנס מספר טלפון לאימות">
            <button id="btn-verify-phone" class="auth-btn" onclick="verifyPhone()">אימות טלפון</button>
            <div id="phone-error" class="error-text">המספר לא מורשה במערכת, הגישה נדחתה.</div>
        </div>

        <!-- שלב 2: הזנת קוד צינתוק (מוסתר בהתחלה) -->
        <div id="step-pin" style="display: none;">
            <input type="password" id="pin-input" class="auth-input" placeholder="הכנס קוד" maxlength="4">
            <button id="btn-verify-pin" class="auth-btn" onclick="verifyPin()">היכנס למערכת</button>
            <div id="pin-error" class="error-text">קוד שגוי, נסה שוב.</div>
        </div>
    </div>

    <!-- ממשק הצ'אט -->
    <div class="chat-container" id="chat-container">
        <header class="chat-header">
            <div class="chat-header-icon">📞</div>
            הודעות שלוחה 1
        </header>

        <div class="chat-messages" id="messages-list">
            <div id="status" class="status-message">מתחבר למערכת וטוען הודעות...</div>
        </div>
    </div>

    <script>
        // כתובת ה-Google Apps Script הקיימת שלך לאימות מספר טלפון.
        // הבדיקה עצמה כבר מתבצעת שם בצד שרת - אין כאן סוד לחשוף.
        const scriptUrl = "https://script.google.com/macros/s/AKfycby9ezg0BTzxyk26LSdbnRzjQy79UZNaC4SXXmiyYdq5NRQNNKqz5IYbiiU2ILDiaoty/exec";

        // שלב 1 - בדיקת הטלפון בשרת
        async function verifyPhone() {
            const phoneVal = document.getElementById('phone-input').value.trim();
            const statusDiv = document.getElementById('auth-status');
            const btnPhone = document.getElementById('btn-verify-phone');
            const errorText = document.getElementById('phone-error');

            if (!phoneVal) return;

            btnPhone.disabled = true;
            errorText.style.display = "none";
            statusDiv.textContent = "בודק הרשאות במערכת, אנא המתן...";

            try {
                const response = await fetch(scriptUrl + "?action=verifyPhone&phone=" + encodeURIComponent(phoneVal));
                const text = await response.text();

                if (text === "Valid") {
                    statusDiv.textContent = "הטלפון אומת ונשלח צינתוק! הזן את הקוד שהתקבל.";
                    document.getElementById('step-phone').style.display = "none";
                    document.getElementById('step-pin').style.display = "block";
                    document.getElementById('pin-input').focus();
                } else {
                    statusDiv.textContent = "";
                    errorText.style.display = "block";
                    btnPhone.disabled = false;
                }
            } catch (error) {
                statusDiv.textContent = "אירעה שגיאת תקשורת מול השרת.";
                btnPhone.disabled = false;
            }
        }

        // שלב 2 - אימות הקוד מול השרת שלנו (לא בקוד הלקוח!)
        async function verifyPin() {
            const pin = document.getElementById('pin-input').value;
            const errorText = document.getElementById('pin-error');
            const btnPin = document.getElementById('btn-verify-pin');

            btnPin.disabled = true;
            errorText.style.display = "none";

            try {
                const response = await fetch('/api/verify-pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin })
                });
                const data = await response.json();

                if (data.ok) {
                    document.getElementById('auth-container').style.display = "none";
                    document.getElementById('chat-container').style.display = "flex";
                    getMessages();
                } else {
                    errorText.style.display = "block";
                    btnPin.disabled = false;
                }
            } catch (error) {
                errorText.textContent = "שגיאת תקשורת, נסה שוב.";
                errorText.style.display = "block";
                btnPin.disabled = false;
            }
        }

        // משיכת ההודעות הקוליות - דרך ה-API הפנימי שלנו בלבד
        async function getMessages() {
            const statusDiv = document.getElementById('status');
            const messagesList = document.getElementById('messages-list');

            try {
                const response = await fetch('/api/messages');
                const data = await response.json();

                if (data.responseStatus === "OK") {
                    statusDiv.style.display = 'none';

                    const audioFiles = data.files || [];

                    if (audioFiles.length > 0) {
                        audioFiles.forEach(file => {
                            // כתובת הקובץ עוברת דרך ה-API שלנו - בלי טוקן גלוי
                            const audioUrl = `/api/audio?name=${encodeURIComponent(file.name)}`;

                            const bubble = document.createElement('div');
                            bubble.className = 'message-bubble';

                            const title = document.createElement('div');
                            title.className = 'message-title';
                            title.textContent = file.name;

                            const audio = document.createElement('audio');
                            audio.className = 'message-audio';
                            audio.controls = true;
                            audio.src = audioUrl;
                            audio.preload = 'metadata';

                            bubble.appendChild(title);
                            bubble.appendChild(audio);

                            messagesList.appendChild(bubble);
                        });

                        setTimeout(() => {
                            messagesList.scrollTop = messagesList.scrollHeight;
                        }, 100);

                    } else {
                        statusDiv.style.display = 'block';
                        statusDiv.textContent = 'לא נמצאו הודעות קוליות בשלוחה זו.';
                    }
                } else {
                    statusDiv.style.display = 'block';
                    statusDiv.textContent = `שגיאה מהשרת: ${data.message || 'שגיאה לא ידועה בבקשת הנתונים'}`;
                }
            } catch (error) {
                console.error('Fetch error:', error);
                statusDiv.style.display = 'block';
                statusDiv.textContent = 'שגיאת תקשורת במשיכת ההודעות.';
            }
        }
    </script>
</body>
</html>
