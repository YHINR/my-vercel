<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הודעות שלוחה 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ECE5DD;
    --surface:#FFFFFF;
    --border:#E9E4DC;
    --text:#111B21;
    --text-dim:#54656F;
    --text-faint:#8696A0;
    --accent:#00A884;
    --accent-dark:#008069;
    --header:#008069;
    --danger:#DC2626;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Assistant',system-ui,sans-serif;
    color:var(--text);
    background-color:var(--bg);
    display:flex;
    justify-content:center;
    height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  svg{display:block;}

  /* ===== מסך אימות ===== */
  #auth-container{
    width:100%;max-width:400px;margin:auto;background:var(--surface);
    padding:32px 28px;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.12);
    text-align:center;display:flex;flex-direction:column;gap:14px;
  }
  #auth-container .auth-logo{
    width:56px;height:56px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;margin:0 auto 4px;color:#fff;
  }
  #auth-container .auth-logo svg{width:26px;height:26px;}
  #auth-container h2{color:var(--header);font-size:1.2rem;font-weight:700;margin-bottom:4px;}
  .auth-sub{font-size:.82rem;color:var(--text-dim);margin-bottom:6px;}
  .auth-btn{
    background:var(--accent);color:#fff;border:none;padding:13px;border-radius:10px;
    font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s;width:100%;
  }
  .auth-btn:hover{background:var(--accent-dark);}
  .auth-btn:disabled{background:#ccc;cursor:not-allowed;}
  .auth-input{
    width:100%;padding:13px;font-size:1rem;border:1px solid var(--border);border-radius:10px;
    text-align:center;font-family:inherit;background:#FAFAFB;
  }
  .auth-input:focus{outline:none;border-color:var(--accent);background:#fff;}
  #auth-status{font-size:.85rem;color:var(--text-dim);min-height:20px;}
  .error-text{color:var(--danger);font-size:.83rem;display:none;margin-top:2px;}

  /* ===== מסך הצ'אט ===== */
  .chat-container{
    width:100%;max-width:400px;display:none;flex-direction:column;height:100%;
    background-color:var(--bg);
    background-image:radial-gradient(circle at 8% 18%, rgba(0,0,0,.02) 0, transparent 45%),
                      radial-gradient(circle at 92% 82%, rgba(0,0,0,.02) 0, transparent 45%);
    box-shadow:0 0 30px rgba(0,0,0,.08);
  }
  .chat-header{
    background:var(--header);color:#fff;padding:14px 20px;display:flex;align-items:center;
    justify-content:space-between;gap:12px;flex-shrink:0;
  }
  .chat-header .title-row{display:flex;align-items:center;gap:12px;}
  .chat-header-icon{
    width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .chat-header-icon svg{width:20px;height:20px;}
  .chat-header b{font-size:1.05rem;font-weight:700;}
  .chat-header span.sub{display:block;font-size:.74rem;color:rgba(255,255,255,.75);font-weight:400;}
  #refreshBtn{
    width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.1);
    color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:background .15s;
  }
  #refreshBtn:hover{background:rgba(255,255,255,.22);}
  #refreshBtn svg{width:18px;height:18px;}
  #refreshBtn.spin svg{animation:spin .7s linear;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .chat-messages{
    flex-grow:1;padding:18px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;
  }
  .status-message{
    text-align:center;padding:24px 16px;color:var(--text-dim);font-size:.9rem;line-height:1.6;
  }
  .status-message.error{color:var(--danger);}

  /* ===== בועת הודעה קולית ===== */
  .rec-row{display:flex;align-items:flex-start;max-width:94%;align-self:flex-start;gap:6px;}
  .rec-bubble{
    position:relative;width:330px;max-width:100%;background:var(--surface);border:none;
    border-radius:22px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:8px;
    box-shadow:0 1px 1px rgba(0,0,0,.08);transition:background .12s;
  }
  .rec-bubble:hover{background:#FAFAF9;}

  /* ===== אווטאר עם ראשי תיבות ===== */
  .voice-avatar{
    position:relative;width:40px;height:40px;border-radius:50%;flex-shrink:0;
    background:var(--border);color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px;
    box-shadow:0 2px 6px rgba(0,0,0,.12);overflow:hidden;
  }

  .voice-avatar svg{width:17px;height:17px;}
  .voice-avatar-badge{
    position:absolute;bottom:-2px;left:-2px;width:17px;height:17px;border-radius:50%;
    background:var(--accent);display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);
  }
  .voice-avatar-badge svg{width:8px;height:8px;color:#fff;}

  .play-btn{
    width:36px;height:36px;flex-shrink:0;border-radius:50%;background:var(--accent);
    border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .1s,background .15s;
  }
  .play-btn:hover{background:var(--accent-dark);}
  .play-btn:active{transform:scale(.92);}
  .play-btn svg{width:14px;height:14px;}

  .rec-wave-row{flex:1;min-width:0;display:flex;align-items:center;gap:6px;}
  .waveform{position:relative;flex:1;height:24px;display:flex;align-items:center;gap:1px;cursor:pointer;min-width:0;}
  .wf-bar{flex:1 1 0;min-width:1px;border-radius:2px;background:#D1D7DB;}
  .wf-bar.played{background:var(--accent);}
  .wf-thumb{
    position:absolute;top:50%;right:0;width:11px;height:11px;border-radius:50%;background:var(--accent);
    box-shadow:0 1px 2px rgba(0,0,0,.25);transform:translate(50%,-50%);pointer-events:none;transition:right .05s linear;
  }
  .rec-time{font-size:.7rem;color:var(--text-faint);flex-shrink:0;min-width:28px;text-align:left;}
  
  /* ===== תגית ההודעה ===== */
  .rec-info{
    display:flex;flex-direction:column;gap:3px;
  }
  .rec-title{font-size:.68rem;color:var(--text-faint);font-weight:500;}
  .rec-phone{font-size:.62rem;color:#8696A0;}

  .voice-tooltip{
    position:fixed;left:0;bottom:0;background:#20272B;color:#fff;border-radius:10px;padding:9px 11px;
    font-size:.72rem;line-height:1.65;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.28);
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .15s ease,transform .15s ease;
    transform:translateY(4px);z-index:1000;text-align:right;
  }
  .voice-tooltip::after{
    content:'';position:absolute;top:100%;left:var(--arrow-x,50%);transform:translateX(-50%);
    border:5px solid transparent;border-top-color:#20272B;
  }
  .voice-tooltip.show{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto;}
  .voice-tooltip b{display:block;font-size:.78rem;margin-bottom:3px;font-weight:600;}
  .voice-tooltip .tt-row{color:#C3CBD1;}
  .voice-tooltip .tt-dur span{color:#fff;}
</style>
</head>
<body>

  <!-- מסך אימות -->
  <div id="auth-container">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    </div>
    <h2>כניסה למערכת</h2>
    <div id="auth-status"></div>

    <div id="step-phone">
      <input type="tel" id="phone-input" class="auth-input" placeholder="הכנס מספר טלפון לאימות">
      <button id="btn-verify-phone" class="auth-btn" onclick="verifyPhone()" style="margin-top:10px;">אימות טלפון</button>
      <div id="phone-error" class="error-text">המספר לא מורשה במערכת, הגישה נדחתה.</div>
    </div>

    <div id="step-pin" style="display:none;">
      <input type="password" id="pin-input" class="auth-input" placeholder="הכנס קוד" maxlength="4">
      <button id="btn-verify-pin" class="auth-btn" onclick="verifyPin()" style="margin-top:10px;">היכנס למערכת</button>
      <div id="pin-error" class="error-text">קוד שגוי, נסה שוב.</div>
    </div>
  </div>

  <!-- ממשק הצ'אט -->
  <div class="chat-container" id="chat-container">
    <header class="chat-header">
      <div class="title-row">
        <div class="chat-header-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        <div>
          <b>הודעות שלוחה 1</b>
          <span class="sub">כל הודעה מוקלטת</span>
        </div>
      </div>
      <button id="refreshBtn" onclick="loadMessages()" title="רענן">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36M3.51 9A9.01 9.01 0 0 0 2 20M20.49 15a9 9 0 0 1-14.85 3.36M20.49 15A9.01 9.01 0 0 0 22 4"/></svg>
      </button>
    </header>
    <div class="chat-messages" id="messages-list"></div>
  </div>

  <div class="voice-tooltip" id="voice-tooltip"></div>

  <script>
    // ===== DEMO MODE =====
    // אם רוצה לבדוק ללא אימות, הגדר: DEMO_MODE = true
    const DEMO_MODE = false;
    const DEMO_PHONE = '0501234567';

    // ===== SheetDB API לקשרים =====
    const CONTACTS_API_URL = "https://sheetdb.io/api/v1/05exs53irv1ll";

    // ===== Call2All API =====
    const BASE_URL = 'https://www.call2all.co.il/ym/api/';
    const IVR_TOKEN = 'YOUR_TOKEN_HERE';
    const IVR_PATH = 'ivr2:1';

    let currentPhone = null;
    let activeAudio = null;
    let activePlayBtn = null;
    let activeSetPlayed = null;

    const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>';
    const BAR_COUNT = 44;

    // ===== טיפול בטלפונים =====
    function normalizePhone(raw) {
      let digits = String(raw || '').replace(/\D/g, '');
      if (!digits) return '';
      if (digits.startsWith('972')) digits = '0' + digits.slice(3);
      if (digits.length > 9) digits = digits.slice(-9);
      return digits;
    }

    function extractPhoneFromFilename(name) {
      const matches = name.match(/\d{7,}/g);
      if (!matches) return '';
      let best = matches.find(m => m.length >= 9 && m.length <= 10) || matches[0];
      return normalizePhone(best);
    }

    function extractPhoneFallback(file) {
      const phoneKeyPattern = /^(phone|callerid|caller_id|calleridnum|ani|src|from|number|tel)$/i;
      for (const key of Object.keys(file || {})) {
        if (!phoneKeyPattern.test(key)) continue;
        const raw = file[key];
        if (!raw) continue;
        const digits = String(raw).replace(/\D/g, '');
        if (digits.length >= 7) return normalizePhone(digits);
      }
      return '';
    }

    function resolvePhoneForFile(file) {
      return extractPhoneFromFilename(file.name || '') || extractPhoneFallback(file);
    }

    // ===== צבעים ראשי תיבות =====
    const AVATAR_COLORS = ['#F06292', '#BA68C8', '#7986CB', '#4FC3F7', '#4DB6AC', '#81C784', '#FFB74D', '#A1887F'];
    
    function avatarColorFor(str) {
      let seed = 0;
      for (let i = 0; i < str.length; i++) seed = (seed * 31 + str.charCodeAt(i)) >>> 0;
      return AVATAR_COLORS[seed % AVATAR_COLORS.length];
    }

    function initialsFor(name) {
      const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return '?';
      return parts.length === 1 ? parts[0][0] : (parts[0][0] + parts[parts.length - 1][0]);
    }

    // ===== משיכת קשרים מ-SheetDB =====
    let contactsMapPromise = null;
    function getContactsMap() {
      if (!CONTACTS_API_URL) return Promise.resolve({});
      if (contactsMapPromise) return contactsMapPromise;
      contactsMapPromise = (async () => {
        try {
          const res = await fetch(CONTACTS_API_URL);
          if (!res.ok) throw new Error('http ' + res.status);
          const data = await res.json();
          const rows = Array.isArray(data) ? data : (Array.isArray(data.data) ? data.data : []);
          const map = {};
          rows.forEach(row => {
            const phone = normalizePhone(row.Phone || row.phone || '');
            if (!phone) return;
            map[phone] = {
              name: row.Name || row.name || '',
              photoUrl: row.PhotoUrl || row.photoUrl || row.PhotoURL || ''
            };
          });
          return map;
        } catch (err) {
          console.error('Contacts fetch error:', err);
          return {};
        }
      })();
      return contactsMapPromise;
    }

    function setStatus(msg, isError = false) {
      const el = document.getElementById('auth-status');
      el.textContent = msg;
      el.className = isError ? 'error-text' : '';
      el.style.display = msg ? 'block' : 'none';
    }

    function fmtTime(seconds) {
      if (!isFinite(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function fmtRemaining(current, duration) {
      if (!isFinite(duration) || duration === 0) return '0:00';
      const remaining = duration - current;
      return fmtTime(Math.max(0, remaining));
    }

    async function computeWaveform(audioUrl) {
      try {
        const response = await fetch(audioUrl);
        const buffer = await response.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const decoded = await audioCtx.decodeAudioData(buffer);
        const rawData = decoded.getChannelData(0);
        const blockSize = Math.floor(rawData.length / BAR_COUNT);
        let peaks = [];
        for (let i = 0; i < BAR_COUNT; i++) {
          let sum = 0;
          for (let j = 0; j < blockSize; j++) {
            sum += Math.abs(rawData[i * blockSize + j]);
          }
          peaks.push(Math.min(1, sum / blockSize));
        }
        return { peaks, duration: decoded.duration };
      } catch {
        return null;
      }
    }

    async function verifyPhone() {
      const phone = document.getElementById('phone-input').value.trim();
      const phoneError = document.getElementById('phone-error');
      
      if (!phone) {
        phoneError.style.display = 'block';
        return;
      }

      const normalized = normalizePhone(phone);
      if (DEMO_MODE || Object.keys(CONTACTS).some(p => normalizePhone(p) === normalized)) {
        currentPhone = normalized;
        document.getElementById('step-phone').style.display = 'none';
        document.getElementById('step-pin').style.display = 'block';
        setStatus('הכנס קוד לאימות');
      } else {
        phoneError.style.display = 'block';
      }
    }

    async function verifyPin() {
      const pin = document.getElementById('pin-input').value;
      const pinError = document.getElementById('pin-error');
      
      if (DEMO_MODE || pin === '1234') {
        document.getElementById('auth-container').style.display = 'none';
        document.getElementById('chat-container').style.display = 'flex';
        loadMessages();
      } else {
        pinError.style.display = 'block';
      }
    }

    // ===== בנייה של בועת הודעה עם פרופיל משופר =====
    function buildMessageBubble(file, audioUrl, contactsMap) {
      contactsMap = contactsMap || {};
      const phone = resolvePhoneForFile(file);
      const contact = phone ? contactsMap[phone] : null;

      const row = document.createElement('div');
      row.className = 'rec-row';

      const col = document.createElement('div');
      col.style.display = 'flex';
      col.style.flexDirection = 'column';
      col.style.gap = '4px';

      const bubble = document.createElement('div');
      bubble.className = 'rec-bubble';

      const avatarWrap = document.createElement('div');
      avatarWrap.style.position = 'relative';
      const avatar = document.createElement('div');
      avatar.className = 'voice-avatar';
      
      // אם יש תמונה - הצג אותה
      if (contact && contact.photoUrl) {
        avatar.innerHTML = '<img src="' + contact.photoUrl + '" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
      } else if (contact && contact.name) {
        // אחרת - צבע עם ראשי תיבות
        const color = avatarColorFor(contact.name);
        const initials = initialsFor(contact.name);
        avatar.style.background = color;
        avatar.style.color = '#fff';
        avatar.style.fontWeight = '600';
        avatar.style.fontSize = '.85rem';
        avatar.textContent = initials;
      } else {
        // אם אין קשר - הצג סימן שאלה
        avatar.style.background = 'var(--border)';
        avatar.style.color = 'var(--text-faint)';
        avatar.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
      }

      avatarWrap.appendChild(avatar);

      const avatarBadge = document.createElement('div');
      avatarBadge.className = 'voice-avatar-badge';
      avatarBadge.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>';
      avatarWrap.appendChild(avatarBadge);
      bubble.appendChild(avatarWrap);

      const playBtn = document.createElement('button');
      playBtn.className = 'play-btn';
      playBtn.innerHTML = ICON_PLAY;
      playBtn.title = 'הפעל הודעה';
      bubble.appendChild(playBtn);

      const waveRow = document.createElement('div');
      waveRow.className = 'rec-wave-row';

      const waveform = document.createElement('div');
      waveform.className = 'waveform';
      const bars = [];
      for (let i = 0; i < BAR_COUNT; i++) {
        const bar = document.createElement('div');
        bar.className = 'wf-bar';
        bar.style.height = Math.round(Math.random() * 22) + 'px';
        waveform.appendChild(bar);
        bars.push(bar);
      }
      const thumb = document.createElement('div');
      thumb.className = 'wf-thumb';
      waveform.appendChild(thumb);

      const timeLabel = document.createElement('span');
      timeLabel.className = 'rec-time';
      timeLabel.textContent = '0:00';
      waveRow.appendChild(waveform);
      waveRow.appendChild(timeLabel);
      bubble.appendChild(waveRow);

      col.appendChild(bubble);

      // ===== תגית המידע =====
      const info = document.createElement('div');
      info.className = 'rec-info';

      if (contact && contact.name) {
        const nameLabel = document.createElement('div');
        nameLabel.className = 'rec-title';
        nameLabel.textContent = contact.name;
        info.appendChild(nameLabel);

        if (phone) {
          const phoneLabel = document.createElement('div');
          phoneLabel.className = 'rec-phone';
          phoneLabel.textContent = phone;
          info.appendChild(phoneLabel);
        }
      } else {
        const nameLabel = document.createElement('div');
        nameLabel.className = 'rec-title';
        nameLabel.textContent = phone || file.name;
        info.appendChild(nameLabel);
      }

      col.appendChild(info);
      row.appendChild(col);

      function setPeaks(peaks) {
        peaks.forEach((p, i) => {
          if (bars[i]) bars[i].style.height = Math.round(p * 22) + 'px';
        });
      }

      function setPlayedRatio(ratio) {
        ratio = Math.max(0, Math.min(1, ratio || 0));
        const exact = ratio * BAR_COUNT;
        const cut = Math.floor(exact);
        const frac = exact - cut;
        bars.forEach((b, i) => {
          if (i < cut) {
            b.classList.add('played');
            b.style.background = '';
          } else if (i === cut && frac > 0) {
            b.classList.remove('played');
            const pct = (frac * 100).toFixed(1) + '%';
            b.style.background = 'linear-gradient(to left, var(--accent) ' + pct + ', #D1D7DB ' + pct + ')';
          } else {
            b.classList.remove('played');
            b.style.background = '';
          }
        });
        thumb.style.right = (ratio * 100) + '%';
      }

      let waveformDataPromise = null;
      function getWaveformData() {
        if (!waveformDataPromise) waveformDataPromise = computeWaveform(audioUrl);
        return waveformDataPromise;
      }

      getWaveformData().then(result => {
        if (result) {
          setPeaks(result.peaks);
          if (result.duration) {
            timeLabel.textContent = fmtRemaining(0, result.duration);
          }
        }
      });

      let audio = null;
      let waveRafId = null;
      let pendingSeekRatio = null;

      function stepWaveform() {
        if (!audio || audio.paused) {
          waveRafId = null;
          return;
        }
        setPlayedRatio(audio.duration ? audio.currentTime / audio.duration : 0);
        waveRafId = requestAnimationFrame(stepWaveform);
      }

      function ensureAudio() {
        if (audio) return audio;
        audio = new Audio(audioUrl);
        audio.preload = 'auto';
        audio.addEventListener('loadedmetadata', () => {
          if (audio.paused) timeLabel.textContent = fmtRemaining(audio.currentTime, audio.duration);
          if (pendingSeekRatio !== null && audio.duration) {
            audio.currentTime = pendingSeekRatio * audio.duration;
            setPlayedRatio(pendingSeekRatio);
            timeLabel.textContent = fmtRemaining(audio.currentTime, audio.duration);
            pendingSeekRatio = null;
          }
        });
        audio.addEventListener('timeupdate', () => {
          timeLabel.textContent = fmtRemaining(audio.currentTime, audio.duration);
        });
        audio.addEventListener('ended', () => {
          playBtn.innerHTML = ICON_PLAY;
          setPlayedRatio(0);
          timeLabel.textContent = fmtRemaining(0, audio.duration);
          if (activeAudio === audio) {
            activeAudio = null;
            activePlayBtn = null;
            activeSetPlayed = null;
          }
          const next = row.nextElementSibling;
          if (next && next.classList && next.classList.contains('rec-row')) {
            setTimeout(() => {
              const nextBtn = next.querySelector('.play-btn');
              if (nextBtn) nextBtn.click();
            }, 350);
          }
        });
        return audio;
      }

      playBtn.onclick = () => {
        ensureAudio();
        if (activeAudio && activeAudio !== audio) {
          activeAudio.pause();
          if (activePlayBtn) activePlayBtn.innerHTML = ICON_PLAY;
          if (activeSetPlayed) activeSetPlayed(0);
        }
        if (audio.paused) {
          audio.play();
          playBtn.innerHTML = ICON_PAUSE;
          activeAudio = audio;
          activePlayBtn = playBtn;
          activeSetPlayed = setPlayedRatio;
          if (waveRafId === null) waveRafId = requestAnimationFrame(stepWaveform);
        } else {
          audio.pause();
          playBtn.innerHTML = ICON_PLAY;
        }
      };

      waveform.onclick = (e) => {
        ensureAudio();
        const rect = waveform.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, 1 - ((e.clientX - rect.left) / rect.width)));
        if (audio.duration && isFinite(audio.duration)) {
          const wasPlaying = !audio.paused;
          if (wasPlaying) audio.pause();
          const target = ratio * audio.duration;
          setPlayedRatio(ratio);
          timeLabel.textContent = fmtRemaining(target, audio.duration);
          audio.currentTime = target;
          if (wasPlaying) {
            const resume = () => {
              audio.removeEventListener('seeked', resume);
              audio.play();
              if (waveRafId === null) waveRafId = requestAnimationFrame(stepWaveform);
            };
            audio.addEventListener('seeked', resume);
          }
        } else {
          pendingSeekRatio = ratio;
          setPlayedRatio(ratio);
          if (audio.readyState === 0) audio.load();
        }
      };

      return row;
    }

    // ===== משיכת ההודעות =====
    async function loadMessages() {
      const listUrl = BASE_URL + `GetIVR2Dir?token=${IVR_TOKEN}&path=${IVR_PATH}`;
      const messagesList = document.getElementById('messages-list');
      const refreshBtn = document.getElementById('refreshBtn');

      refreshBtn.classList.add('spin');
      setStatus('טוען הודעות...');

      try {
        const [response, contactsMap] = await Promise.all([
          fetch(listUrl),
          getContactsMap()
        ]);
        const data = await response.json();

        if (data.responseStatus === "OK") {
          let audioFiles = data.files
            ? data.files.filter(f => f.name.endsWith('.wav') || f.name.endsWith('.mp3'))
            : [];
          audioFiles.sort((a, b) => {
            const numA = parseInt(a.name.replace(/\D/g, '')) || 0;
            const numB = parseInt(b.name.replace(/\D/g, '')) || 0;
            return numA - numB;
          });

          if (audioFiles.length > 0) {
            messagesList.innerHTML = '';
            audioFiles.forEach(file => {
              const audioUrl = `${BASE_URL}DownloadFile?token=${IVR_TOKEN}&path=${IVR_PATH}/${file.name}`;
              messagesList.appendChild(buildMessageBubble(file, audioUrl, contactsMap));
            });
            setTimeout(() => {
              messagesList.scrollTop = messagesList.scrollHeight;
            }, 100);
          } else {
            setStatus('לא נמצאו הודעות קוליות בשלוחה זו.');
          }
        } else {
          setStatus(`שגיאה מהשרת: ${data.message || 'שגיאה לא ידועה'}`, true);
        }
      } catch (error) {
        console.error('Fetch error:', error);
        setStatus('שגיאת תקשורת במשיכת ההודעות.', true);
      } finally {
        refreshBtn.classList.remove('spin');
      }
    }

    document.getElementById('refreshBtn').onclick = () => {
      document.getElementById('refreshBtn').classList.add('spin');
      contactsMapPromise = null; // לרענן גם את רשימת אנשי הקשר
      loadMessages().finally(() => {
        document.getElementById('refreshBtn').classList.remove('spin');
      });
    };
  </script>
</body>
