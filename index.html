<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הודעות שלוחה</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      direction: rtl;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 100%;
      padding: 40px;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #555;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input[type="tel"] {
      direction: ltr;
      text-align: left;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-admin {
      background: #f0f0f0;
      color: #333;
      border: 2px solid #e0e0e0;
    }

    .btn-admin:hover {
      background: #e0e0e0;
    }

    .messages-list {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 2px solid #f0f0f0;
    }

    .message-item {
      padding: 15px;
      background: #f9f9f9;
      border-radius: 8px;
      margin-bottom: 12px;
      border-right: 4px solid #667eea;
    }

    .message-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .message-audio {
      margin-top: 10px;
    }

    audio {
      width: 100%;
      height: 30px;
      border-radius: 4px;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
      display: none;
    }

    .status.error {
      background: #fee;
      color: #c00;
      display: block;
    }

    .status.success {
      background: #efe;
      color: #060;
      display: block;
    }

    .admin-notice {
      background: linear-gradient(135deg, #ffa500 0%, #ff7f50 100%);
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 15px;
    }

    .admin-notice a {
      color: white;
      text-decoration: underline;
      font-weight: bold;
    }

    .loader {
      display: none;
      text-align: center;
      color: #667eea;
      font-weight: 600;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>☎️ הודעות שלוחה</h1>
  <p class="subtitle">שירות הודעות קוליות מאובטח</p>

  <div class="admin-notice">
    👨‍💼 <a href="admin.html" target="_blank">לוח ניהול</a> (מנהלים בלבד)
  </div>

  <div class="status" id="status"></div>

  <form onsubmit="handleSubmit(event)">
    <div class="form-group">
      <label for="phone">📱 מספר הטלפון שלך</label>
      <input 
        type="tel" 
        id="phone" 
        placeholder="0521234567" 
        required 
        pattern="^\d{10}$"
        title="הזן 10 ספרות"
      >
    </div>

    <div class="form-group">
      <label for="pin">🔐 קוד הגישה</label>
      <input 
        type="password" 
        id="pin" 
        placeholder="••••" 
        required 
        inputmode="numeric"
        pattern="^\d+$"
      >
    </div>

    <div class="button-group">
      <button type="submit" class="btn-primary">הכנס</button>
    </div>
  </form>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p>⏳ בדיקה...</p>
  </div>

  <div class="messages-list" id="messagesList" style="display: none;">
    <h2>🎵 ההודעות שלך</h2>
    <div id="messagesContainer"></div>
  </div>

  <div class="footer">
    © 2024 שירות הודעות שלוחה - כל הזכויות שמורות
  </div>
</div>

<script>
async function handleSubmit(e) {
  e.preventDefault();

  const phone = document.getElementById('phone').value;
  const pin = document.getElementById('pin').value;
  const status = document.getElementById('status');
  const loader = document.getElementById('loader');
  const messagesList = document.getElementById('messagesList');

  // ניקוי הודעות קודמות
  status.className = 'status';
  loader.style.display = 'none';
  messagesList.style.display = 'none';

  // בדיקת ה-PIN
  loader.style.display = 'block';

  try {
    const response = await fetch('/api/verify-pin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin, phone })
    });

    const result = await response.json();

    if (result.ok) {
      // הצלחה - שליפת ההודעות
      status.className = 'status success';
      status.textContent = '✓ הגישה אושרה! טוען הודעות...';

      const messagesResponse = await fetch('/api/messages');
      const messagesData = await messagesResponse.json();

      if (messagesData.responseStatus === 'OK' && messagesData.files?.length > 0) {
        displayMessages(messagesData.files);
        messagesList.style.display = 'block';
      } else {
        status.className = 'status success';
        status.textContent = '✓ אין הודעות חדשות שלך כרגע.';
      }
    } else {
      // כשל
      status.className = 'status error';
      status.textContent = '❌ קוד גישה לא נכון. נסה שוב.';
    }
  } catch (err) {
    status.className = 'status error';
    status.textContent = '⚠️ שגיאה בחיבור לשרת. נסה שוב מאוחר יותר.';
    console.error('Error:', err);
  }

  loader.style.display = 'none';
}

function displayMessages(files) {
  const container = document.getElementById('messagesContainer');
  container.innerHTML = '';

  files.forEach(file => {
    const div = document.createElement('div');
    div.className = 'message-item';
    div.innerHTML = `
      <div class="message-title">📝 ${file.name}</div>
      <div class="message-audio">
        <audio controls>
          <source src="/api/audio?name=${encodeURIComponent(file.name)}" type="audio/mpeg">
          הדפדפן שלך לא תומך בהשמעת אודיו
        </audio>
      </div>
    `;
    container.appendChild(div);
  });
}
</script>

</body>
</html>
