<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טריוויה - משחק</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        .welcome-screen {
            text-align: center;
        }
        
        .welcome-screen h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .logo {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #555;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.1em;
            font-family: inherit;
            text-align: center;
            direction: ltr;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .quiz-screen {
            display: none;
        }
        
        .player-info {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .player-info h2 {
            color: #667eea;
            font-size: 1.3em;
        }
        
        .question-container {
            margin-bottom: 30px;
        }
        
        .question-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 8px;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        .answers-container {
            display: grid;
            gap: 12px;
        }
        
        .answer-btn {
            background: white;
            color: #333;
            border: 2px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            text-align: right;
        }
        
        .answer-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateX(-5px);
        }
        
        .answer-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .answer-btn.correct {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }
        
        .answer-btn.incorrect {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
        }
        
        .result-message {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
            display: none;
        }
        
        .result-message.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        
        .result-message.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        .button-group button {
            flex: 1;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-weight: bold;
            font-size: 1.2em;
        }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .stats-bar {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            color: #667eea;
            font-weight: bold;
        }
        
        .success-animation {
            animation: bounce 0.6s ease-in-out;
        }
        
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- צג הכניסה -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="logo">🎮</div>
            <h1>ברוכים הבאים לטריוויה!</h1>
            
            <div class="form-group">
                <label for="idInput">הכנס את מספר תעודת הזהות שלך:</label>
                <input type="text" id="idInput" placeholder="למשל: 123456789" inputmode="numeric">
            </div>
            
            <div id="newPlayerSection" style="display: none;">
                <div class="form-group">
                    <label for="nameInput">הכנס את שמך (לא מצאנו אותך כתלמיד קיים):</label>
                    <input type="text" id="nameInput" placeholder="שם מלא">
                </div>
                <button onclick="registerNewPlayer()">📝 הרשם ותחל משחק</button>
            </div>
            
            <button id="startBtn" onclick="startQuiz()">▶️ התחל משחק</button>
            
            <div id="errorContainer"></div>
        </div>
        
        <!-- צג הטריוויה -->
        <div class="quiz-screen" id="quizScreen">
            <div class="player-info">
                <h2>🎯 <span id="playerNameDisplay"></span></h2>
            </div>
            
            <div class="stats-bar" id="statsBar"></div>
            
            <div class="question-container">
                <div class="question-text" id="questionText"></div>
            </div>
            
            <div class="answers-container" id="answersContainer"></div>
            
            <div class="result-message" id="resultMessage"></div>
            
            <div class="button-group" id="buttonGroup" style="display: none;">
                <button onclick="goBack()" style="background: #6c757d;">🔙 חזור</button>
                <button onclick="nextQuestion()" style="display: none;" id="nextBtn">➡️ שאלה הבאה</button>
            </div>
        </div>
        
        <!-- צג טעינה -->
        <div id="loadingScreen" style="display: none;">
            <div class="loading">
                <div class="loader"></div>
                <p>טוען שאלות...</p>
            </div>
        </div>
    </div>
    
    <script>
        // שנה את זה לכתובת ה-Cloudflare Worker שלך
        const WORKER_URL = 'https://trivia-api.yeladim-haynrich.workers.dev';
        
        let currentPlayer = null;
        let questions = [];
        let currentQuestion = null;
        let selectedAnswer = null;
        let answered = false;
        
        async function startQuiz() {
            const idInput = document.getElementById('idInput').value.trim();
            
            if (!idInput) {
                showError('אנא הכנס מספר תעודת זהות');
                return;
            }
            
            // בדוק אם התלמיד קיים
            try {
                document.getElementById('loadingScreen').style.display = 'block';
                document.getElementById('startBtn').style.display = 'none';
                
                const response = await fetch(`${WORKER_URL}/api/questions?studentId=${idInput}`);
                
                if (response.status === 404) {
                    // תלמיד חדש
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('startBtn').style.display = 'block';
                    document.getElementById('newPlayerSection').style.display = 'block';
                    document.getElementById('idInput').disabled = true;
                    showError('');
                    return;
                }
                
                if (!response.ok) {
                    throw new Error('שגיאה בטעינת השאלות');
                }
                
                const data = await response.json();
                questions = data.questions;
                
                if (questions.length === 0) {
                    throw new Error('אין שאלות זמינות כרגע');
                }
                
                currentPlayer = { id: idInput };
                displayQuiz();
                
            } catch (error) {
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('startBtn').style.display = 'block';
                showError(error.message);
            }
        }
        
        async function registerNewPlayer() {
            const idInput = document.getElementById('idInput').value.trim();
            const nameInput = document.getElementById('nameInput').value.trim();
            
            if (!nameInput) {
                showError('אנא הכנס שם');
                return;
            }
            
            try {
                document.getElementById('loadingScreen').style.display = 'block';
                
                const response = await fetch(`${WORKER_URL}/api/students`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idNumber: idInput, name: nameInput })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error);
                }
                
                // קבל את השאלות
                const qResponse = await fetch(`${WORKER_URL}/api/questions?studentId=${idInput}`);
                const data = await qResponse.json();
                questions = data.questions;
                
                currentPlayer = { id: idInput, name: nameInput };
                displayQuiz();
                
            } catch (error) {
                document.getElementById('loadingScreen').style.display = 'none';
                showError(error.message);
            }
        }
        
        async function displayQuiz() {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'block';
            
            document.getElementById('playerNameDisplay').textContent = currentPlayer.name || 'שחקן';
            
            displayQuestion();
        }
        
        function displayQuestion() {
            if (questions.length === 0) {
                document.getElementById('questionText').textContent = 'אין שאלות זמינות';
                return;
            }
            
            currentQuestion = questions[Math.floor(Math.random() * questions.length)];
            selectedAnswer = null;
            answered = false;
            
            document.getElementById('questionText').textContent = currentQuestion.question;
            document.getElementById('resultMessage').style.display = 'none';
            document.getElementById('resultMessage').className = 'result-message';
            
            // ערבב תשובות
            const allAnswers = [currentQuestion.correctAnswer, ...currentQuestion.wrongAnswers];
            const shuffled = allAnswers.sort(() => Math.random() - 0.5);
            
            const answersHTML = shuffled.map(answer => `
                <button class="answer-btn" onclick="selectAnswer('${answer.replace(/'/g, "\\'")}', this)">
                    ${answer}
                </button>
            `).join('');
            
            document.getElementById('answersContainer').innerHTML = answersHTML;
            document.getElementById('buttonGroup').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            
            updateStatsBar();
        }
        
        async function selectAnswer(answer, buttonElement) {
            if (answered) return;
            
            selectedAnswer = answer;
            
            // הסר בחירה קודמת
            document.querySelectorAll('.answer-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            buttonElement.classList.add('selected');
            
            const isCorrect = answer === currentQuestion.correctAnswer;
            
            // שלח לשרת
            try {
                await fetch(`${WORKER_URL}/api/submit-answer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        studentId: currentPlayer.id,
                        questionId: currentQuestion.id,
                        isCorrect: isCorrect
                    })
                });
            } catch (error) {
                console.error('Error submitting answer:', error);
            }
            
            showResult(isCorrect, answer);
        }
        
        function showResult(isCorrect, selectedAnswer) {
            answered = true;
            
            // צבע כפתורים
            document.querySelectorAll('.answer-btn').forEach(btn => {
                const btnText = btn.textContent.trim();
                if (btnText === currentQuestion.correctAnswer) {
                    btn.classList.add('correct');
                } else if (btnText === selectedAnswer && !isCorrect) {
                    btn.classList.add('incorrect');
                }
                btn.style.pointerEvents = 'none';
            });
            
            // הצג הודעה
            const resultDiv = document.getElementById('resultMessage');
            if (isCorrect) {
                resultDiv.className = 'result-message correct success-animation';
                resultDiv.textContent = '✅ תשובה נכונה! ברכותייך!';
            } else {
                resultDiv.className = 'result-message incorrect';
                resultDiv.textContent = `❌ תשובה שגויה! התשובה הנכונה היא: "${currentQuestion.correctAnswer}"`;
            }
            resultDiv.style.display = 'block';
            
            // הצג כפתורים
            document.getElementById('buttonGroup').style.display = 'flex';
            document.getElementById('nextBtn').style.display = 'block';
        }
        
        function nextQuestion() {
            displayQuestion();
        }
        
        function goBack() {
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('welcomeScreen').style.display = 'block';
            document.getElementById('idInput').value = '';
            document.getElementById('idInput').disabled = false;
            document.getElementById('nameInput').value = '';
            document.getElementById('newPlayerSection').style.display = 'none';
            document.getElementById('startBtn').style.display = 'block';
            showError('');
        }
        
        async function updateStatsBar() {
            try {
                const response = await fetch(`${WORKER_URL}/api/stats?studentId=${currentPlayer.id}`);
                if (response.ok) {
                    const data = await response.json();
                    const stats = data.student;
                    document.getElementById('statsBar').innerHTML = `
                        ✅ ${stats.correctAnswers} תשובות נכונות | 
                        📊 ${stats.totalAnswers} משחקים | 
                        🎯 ${stats.percentage}%
                    `;
                }
            } catch (error) {
                console.error('Error fetching stats:', error);
            }
        }
        
        function showError(message) {
            const container = document.getElementById('errorContainer');
            if (message) {
                container.innerHTML = `<div class="error-message">${message}</div>`;
            } else {
                container.innerHTML = '';
            }
        }
        
        // Focus on input
        window.addEventListener('load', () => {
            document.getElementById('idInput').focus();
        });
        
        // Allow Enter to start
        document.getElementById('idInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                startQuiz();
            }
        });
    </script>
</body>
</html>
