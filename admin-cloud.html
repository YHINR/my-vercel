<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - טריוויה</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        h2 {
            color: #667eea;
            font-size: 1.3em;
            margin-bottom: 15px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            color: #555;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            width: 100%;
        }
        
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .list-container {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
        }
        
        .list-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-right: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .item-info {
            flex: 1;
        }
        
        .item-info strong {
            color: #667eea;
            display: block;
            margin-bottom: 5px;
        }
        
        .item-info small {
            color: #888;
        }
        
        .delete-btn {
            background: #dc3545;
            padding: 8px 15px;
            font-size: 0.9em;
            width: auto;
        }
        
        .delete-btn:hover {
            background: #c82333;
        }
        
        .stats {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            text-align: center;
        }
        
        .stat-item h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .stat-item p {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-right: 4px solid #28a745;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-right: 4px solid #dc3545;
        }
        
        .nav-links {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .nav-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            margin: 0 15px;
            transition: all 0.3s;
        }
        
        .nav-links a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Admin Panel - ניהול טריוויה</h1>
        
        <div class="nav-links">
            <a href="trivia-online.html">🎯 לחזור למשחק</a>
            <span style="color: #ddd;">|</span>
            <a href="javascript:void(0)" onclick="logout()">🔐 התנתק</a>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <h3 id="questionCount">0</h3>
                <p>שאלות בסיסטם</p>
            </div>
            <div class="stat-item">
                <h3 id="connectionStatus">❌</h3>
                <p>חיבור ל-Cloudflare</p>
            </div>
        </div>
        
        <div id="message"></div>
        
        <!-- הגדרות חיבור -->
        <div class="section" id="connectionSection">
            <h2>⚙️ הגדרות חיבור</h2>
            <div class="form-group">
                <label for="workerUrl">Worker URL:</label>
                <input type="text" id="workerUrl" placeholder="https://trivia-api.YOUR_USERNAME.workers.dev">
            </div>
            <div class="form-group">
                <label for="adminPassword">Admin Password:</label>
                <input type="password" id="adminPassword" placeholder="סיסמה">
            </div>
            <button onclick="testConnection()">🔗 בדוק חיבור</button>
        </div>
        
        <!-- הוספת שאלה -->
        <div class="section" id="questionSection" style="display: none;">
            <h2>❓ הוספת שאלה טריוויה</h2>
            <div class="form-group">
                <label for="question">השאלה:</label>
                <textarea id="question" placeholder="כתוב את השאלה כאן..."></textarea>
            </div>
            <div class="form-group">
                <label for="correctAnswer">התשובה הנכונה:</label>
                <input type="text" id="correctAnswer" placeholder="התשובה הנכונה">
            </div>
            <div class="form-group">
                <label for="wrongAnswer1">תשובה שגויה 1:</label>
                <input type="text" id="wrongAnswer1" placeholder="תשובה שגויה">
            </div>
            <div class="form-group">
                <label for="wrongAnswer2">תשובה שגויה 2:</label>
                <input type="text" id="wrongAnswer2" placeholder="תשובה שגויה">
            </div>
            <button onclick="addQuestion()">❓ הוסף שאלה</button>
        </div>
        
        <!-- רשימת שאלות -->
        <div class="section" id="listSection" style="display: none;">
            <h2>📚 רשימת שאלות</h2>
            <div class="list-container" id="questionsList">
                <p style="color: #999; text-align: center;">טוען שאלות...</p>
            </div>
        </div>
    </div>
    
    <script>
        let workerUrl = localStorage.getItem('workerUrl') || '';
        let adminPassword = localStorage.getItem('adminPassword') || '';
        let isConnected = false;
        
        window.addEventListener('load', () => {
            if (workerUrl && adminPassword) {
                document.getElementById('workerUrl').value = workerUrl;
                document.getElementById('adminPassword').value = adminPassword;
                testConnection();
            }
        });
        
        async function testConnection() {
            workerUrl = document.getElementById('workerUrl').value.trim();
            adminPassword = document.getElementById('adminPassword').value.trim();
            
            if (!workerUrl || !adminPassword) {
                showMessage('אנא מלא את כל השדות', 'error');
                return;
            }
            
            try {
                document.getElementById('connectionStatus').textContent = '⏳';
                
                const response = await fetch(`${workerUrl}/api/admin/questions?password=${adminPassword}`);
                
                if (response.ok) {
                    localStorage.setItem('workerUrl', workerUrl);
                    localStorage.setItem('adminPassword', adminPassword);
                    
                    isConnected = true;
                    document.getElementById('connectionStatus').textContent = '✅';
                    document.getElementById('connectionSection').style.display = 'none';
                    document.getElementById('questionSection').style.display = 'block';
                    document.getElementById('listSection').style.display = 'block';
                    
                    showMessage('✅ מחובר בהצלחה!', 'success');
                    loadQuestions();
                } else {
                    isConnected = false;
                    document.getElementById('connectionStatus').textContent = '❌';
                    showMessage('❌ סיסמה שגויה או Worker לא זמין', 'error');
                }
            } catch (error) {
                isConnected = false;
                document.getElementById('connectionStatus').textContent = '❌';
                showMessage(`❌ שגיאה בחיבור: ${error.message}`, 'error');
            }
        }
        
        async function addQuestion() {
            if (!isConnected) {
                showMessage('אנא התחבר תחילה', 'error');
                return;
            }
            
            const question = document.getElementById('question').value.trim();
            const correctAnswer = document.getElementById('correctAnswer').value.trim();
            const wrongAnswer1 = document.getElementById('wrongAnswer1').value.trim();
            const wrongAnswer2 = document.getElementById('wrongAnswer2').value.trim();
            
            if (!question || !correctAnswer || !wrongAnswer1 || !wrongAnswer2) {
                showMessage('אנא מלא את כל השדות', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${workerUrl}/api/admin/questions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        password: adminPassword,
                        question: question,
                        correctAnswer: correctAnswer,
                        wrongAnswers: [wrongAnswer1, wrongAnswer2]
                    })
                });
                
                if (response.ok) {
                    document.getElementById('question').value = '';
                    document.getElementById('correctAnswer').value = '';
                    document.getElementById('wrongAnswer1').value = '';
                    document.getElementById('wrongAnswer2').value = '';
                    
                    showMessage('✅ שאלה נוספה בהצלחה!', 'success');
                    loadQuestions();
                } else {
                    const error = await response.json();
                    showMessage(`❌ ${error.error}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ שגיאה: ${error.message}`, 'error');
            }
        }
        
        async function loadQuestions() {
            try {
                const response = await fetch(`${workerUrl}/api/admin/questions?password=${adminPassword}`);
                const data = await response.json();
                const questions = data.questions || [];
                
                document.getElementById('questionCount').textContent = questions.length;
                
                if (questions.length === 0) {
                    document.getElementById('questionsList').innerHTML = 
                        '<p style="color: #999; text-align: center;">אין שאלות עדיין</p>';
                    return;
                }
                
                const html = questions.map((q, index) => `
                    <div class="list-item">
                        <div class="item-info">
                            <strong>#${index + 1} - ${q.question}</strong>
                            <small>✅ ${q.correctAnswer}</small>
                        </div>
                        <button class="delete-btn" onclick="deleteQuestion('${q.id}')">🗑️ מחק</button>
                    </div>
                `).join('');
                
                document.getElementById('questionsList').innerHTML = html;
            } catch (error) {
                console.error('Error loading questions:', error);
            }
        }
        
        async function deleteQuestion(questionId) {
            if (!confirm('האם למחוק את השאלה?')) return;
            
            try {
                const response = await fetch(
                    `${workerUrl}/api/admin/questions?password=${adminPassword}&id=${questionId}`,
                    { method: 'DELETE' }
                );
                
                if (response.ok) {
                    showMessage('✅ השאלה נמחקה', 'success');
                    loadQuestions();
                } else {
                    showMessage('❌ שגיאה במחיקה', 'error');
                }
            } catch (error) {
                showMessage(`❌ שגיאה: ${error.message}`, 'error');
            }
        }
        
        function logout() {
            localStorage.removeItem('workerUrl');
            localStorage.removeItem('adminPassword');
            location.reload();
        }
        
        function showMessage(text, type = 'success') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type}-message">${text}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 3000);
        }
    </script>
</body>
</html>
