<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול טריוויה</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        h2 {
            color: #667eea;
            font-size: 1.3em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            color: #555;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            width: 100%;
        }
        
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .list-container {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
        }
        
        .list-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-right: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .item-info {
            flex: 1;
        }
        
        .item-info strong {
            color: #667eea;
            display: block;
            margin-bottom: 5px;
        }
        
        .item-info small {
            color: #888;
        }
        
        .delete-btn {
            background: #dc3545;
            padding: 8px 15px;
            font-size: 0.9em;
            margin-right: 10px;
            width: auto;
        }
        
        .delete-btn:hover {
            background: #c82333;
        }
        
        .edit-btn {
            background: #28a745;
            padding: 8px 15px;
            font-size: 0.9em;
            margin-right: 10px;
            width: auto;
        }
        
        .edit-btn:hover {
            background: #218838;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        
        .stats {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            text-align: center;
        }
        
        .stat-item h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .stat-item p {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-right: 4px solid #28a745;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-right: 4px solid #dc3545;
        }
        
        .export-section {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            border-right: 4px solid #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        .button-group button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 ניהול מערכת טריוויה</h1>
        
        <div class="stats">
            <div class="stat-item">
                <h3 id="playerCount">0</h3>
                <p>שחקנים רשומים</p>
            </div>
            <div class="stat-item">
                <h3 id="questionCount">0</h3>
                <p>שאלות מוגדרות</p>
            </div>
        </div>
        
        <div id="message"></div>
        
        <!-- הוספת שחקן -->
        <div class="section">
            <h2>➕ הוספת שחקן חדש</h2>
            <div class="form-group">
                <label for="idNumber">מספר תעודת זהות:</label>
                <input type="text" id="idNumber" placeholder="למשל: 123456789">
            </div>
            <div class="form-group">
                <label for="playerName">שם השחקן:</label>
                <input type="text" id="playerName" placeholder="שם מלא">
            </div>
            <button onclick="addPlayer()">➕ הוסף שחקן</button>
        </div>
        
        <!-- רשימת שחקנים -->
        <div class="section">
            <h2>📋 רשימת שחקנים</h2>
            <div class="list-container" id="playersList">
                <p style="color: #999; text-align: center;">אין שחקנים עדיין</p>
            </div>
        </div>
        
        <!-- הוספת שאלה -->
        <div class="section" id="questionSection" style="display: none;">
            <h2>❓ הוספת שאלה טריוויה (לכל השחקנים)</h2>
            <div class="form-group">
                <label for="question">השאלה:</label>
                <textarea id="question" placeholder="כתוב את השאלה כאן..."></textarea>
            </div>
            <div class="form-group">
                <label for="correctAnswer">התשובה הנכונה:</label>
                <input type="text" id="correctAnswer" placeholder="התשובה הנכונה">
            </div>
            <div class="form-group">
                <label for="wrongAnswer1">תשובה שגויה 1:</label>
                <input type="text" id="wrongAnswer1" placeholder="תשובה שגויה">
            </div>
            <div class="form-group">
                <label for="wrongAnswer2">תשובה שגויה 2:</label>
                <input type="text" id="wrongAnswer2" placeholder="תשובה שגויה">
            </div>
            <button onclick="addQuestion()">❓ הוסף שאלה</button>
        </div>
        
        <!-- הודעה כשאין שחקנים -->
        <div class="section" id="noPlayersSection">
            <div class="error-message">⚠️ אין שחקנים עדיין! הוסף שחקן קודם בסעיף למעלה כדי להוסיף שאלות.</div>
        </div>
        
        <!-- רשימת שאלות -->
        <div class="section">
            <h2>📚 רשימת שאלות</h2>
            <div class="list-container" id="questionsList">
                <p style="color: #999; text-align: center;">אין שאלות עדיין</p>
            </div>
        </div>
        
        <!-- ייצוא/ייבוא -->
        <div class="section export-section">
            <h2>💾 גיבוי נתונים</h2>
            <div class="button-group">
                <button onclick="downloadData()">⬇️ הורד גיבוי</button>
                <button onclick="clearAllData()" style="background: #dc3545;">🗑️ מחק הכל</button>
            </div>
        </div>
    </div>
    
    <script>
        const STORAGE_KEY = 'triviaData';
        
        function getStoredData() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : { players: [], questions: [] };
        }
        
        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            updateUI();
            showMessage('נשמר בהצלחה! ✅', 'success');
        }
        
        function showMessage(text, type = 'success') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type}-message">${text}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 3000);
        }
        
        function addPlayer() {
            const idNumber = document.getElementById('idNumber').value.trim();
            const playerName = document.getElementById('playerName').value.trim();
            
            if (!idNumber || !playerName) {
                showMessage('אנא מלא את כל השדות', 'error');
                return;
            }
            
            const data = getStoredData();
            
            if (data.players.some(p => p.id === idNumber)) {
                showMessage('קוד זהות זה כבר קיים!', 'error');
                return;
            }
            
            data.players.push({
                id: idNumber,
                name: playerName,
                addedAt: new Date().toLocaleString('he-IL')
            });
            
            document.getElementById('idNumber').value = '';
            document.getElementById('playerName').value = '';
            saveData(data);
        }
        
        function deletePlayer(id) {
            if (confirm('האם למחוק שחקן זה?')) {
                const data = getStoredData();
                data.players = data.players.filter(p => p.id !== id);
                saveData(data);
            }
        }
        
        function addQuestion() {
            const question = document.getElementById('question').value.trim();
            const correctAnswer = document.getElementById('correctAnswer').value.trim();
            const wrongAnswer1 = document.getElementById('wrongAnswer1').value.trim();
            const wrongAnswer2 = document.getElementById('wrongAnswer2').value.trim();
            
            if (!question || !correctAnswer || !wrongAnswer1 || !wrongAnswer2) {
                showMessage('אנא מלא את כל השדות', 'error');
                return;
            }
            
            const data = getStoredData();
            
            data.questions.push({
                id: Date.now(),
                question: question,
                correctAnswer: correctAnswer,
                wrongAnswers: [wrongAnswer1, wrongAnswer2],
                addedAt: new Date().toLocaleString('he-IL')
            });
            
            document.getElementById('question').value = '';
            document.getElementById('correctAnswer').value = '';
            document.getElementById('wrongAnswer1').value = '';
            document.getElementById('wrongAnswer2').value = '';
            saveData(data);
        }
        
        function deleteQuestion(questionId) {
            if (confirm('האם למחוק את השאלה?')) {
                const data = getStoredData();
                data.questions = data.questions.filter(q => q.id !== questionId);
                saveData(data);
            }
        }
        
        function editQuestion(questionId) {
            const data = getStoredData();
            const question = data.questions.find(q => q.id === questionId);
            
            if (question) {
                document.getElementById('question').value = question.question;
                document.getElementById('correctAnswer').value = question.correctAnswer;
                document.getElementById('wrongAnswer1').value = question.wrongAnswers[0];
                document.getElementById('wrongAnswer2').value = question.wrongAnswers[1];
                
                deleteQuestion(questionId);
                document.getElementById('question').focus();
            }
        }
        
        function updateUI() {
            const data = getStoredData();
            
            // הצג/הסתר סעיף שאלות
            const questionSection = document.getElementById('questionSection');
            const noPlayersSection = document.getElementById('noPlayersSection');
            
            if (data.players.length === 0) {
                questionSection.style.display = 'none';
                noPlayersSection.style.display = 'block';
            } else {
                questionSection.style.display = 'block';
                noPlayersSection.style.display = 'none';
            }
            
            // עדכן ספירות
            document.getElementById('playerCount').textContent = data.players.length;
            document.getElementById('questionCount').textContent = data.questions.length;
            
            // עדכן רשימת שחקנים
            const playersHTML = data.players.length === 0 
                ? '<p style="color: #999; text-align: center;">אין שחקנים עדיין</p>'
                : data.players.map(p => `
                    <div class="list-item">
                        <div class="item-info">
                            <strong>🆔 ${p.name}</strong>
                            <small>תעודת זהות: ${p.id}</small>
                        </div>
                        <div class="action-buttons">
                            <button class="delete-btn" onclick="deletePlayer('${p.id}')">🗑️ מחק</button>
                        </div>
                    </div>
                `).join('');
            document.getElementById('playersList').innerHTML = playersHTML;
            
            // עדכן רשימת שאלות
            const questionsHTML = data.questions.length === 0
                ? '<p style="color: #999; text-align: center;">אין שאלות עדיין</p>'
                : data.questions.map((q, index) => `
                    <div class="list-item">
                        <div class="item-info">
                            <strong>#${index + 1} ❓ ${q.question}</strong>
                            <small>✅ תשובה: ${q.correctAnswer}</small>
                        </div>
                        <div class="action-buttons">
                            <button class="edit-btn" onclick="editQuestion(${q.id})">✏️ ערוך</button>
                            <button class="delete-btn" onclick="deleteQuestion(${q.id})">🗑️ מחק</button>
                        </div>
                    </div>
                `).join('');
            document.getElementById('questionsList').innerHTML = questionsHTML;
        }
        
        function downloadData() {
            const data = getStoredData();
            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `trivia-backup-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
        }
        
        function clearAllData() {
            if (confirm('האם אתה בטוח שברצונך למחוק את כל הנתונים? לא ניתן לשחזר את זה!')) {
                localStorage.removeItem(STORAGE_KEY);
                updateUI();
                showMessage('כל הנתונים מחוקים', 'success');
            }
        }
        
        // עדכן את ה-UI כשהעמוד נטען
        updateUI();
        
        // עדכן את ה-UI כל שנייה כדי לתפוס שינויים מקובצים אחרים
        setInterval(updateUI, 1000);
    </script>
</body>
</html>
