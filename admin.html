<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>לוח ניהול - הודעות שלוחה</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * { direction: rtl; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .fade-in { animation: fadeIn 0.5s ease-in; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .badge-success { @apply bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-medium; }
    .badge-error { @apply bg-red-100 text-red-800 px-3 py-1 rounded-full text-sm font-medium; }
    .log-row { @apply hover:bg-gray-50 transition-colors; }
    .stat-card { @apply bg-gradient-to-br rounded-xl p-6 text-white shadow-lg; }
  </style>
</head>
<body class="bg-gray-50">

<div class="min-h-screen">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-gray-900">📊 לוח ניהול הודעות</h1>
      <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition">
        התנתקות
      </button>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto p-6 space-y-6">

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
      <div class="stat-card from-blue-500 to-blue-600">
        <div class="text-sm opacity-90">סך הנסיונות</div>
        <div class="text-3xl font-bold mt-2" id="stat-total">0</div>
      </div>
      <div class="stat-card from-green-500 to-green-600">
        <div class="text-sm opacity-90">הצלחות ✓</div>
        <div class="text-3xl font-bold mt-2" id="stat-success">0</div>
      </div>
      <div class="stat-card from-red-500 to-red-600">
        <div class="text-sm opacity-90">כשלונות ✗</div>
        <div class="text-3xl font-bold mt-2" id="stat-failed">0</div>
      </div>
      <div class="stat-card from-purple-500 to-purple-600">
        <div class="text-sm opacity-90">טלפונים ייחודיים</div>
        <div class="text-3xl font-bold mt-2" id="stat-unique">0</div>
      </div>
      <div class="stat-card from-orange-500 to-orange-600">
        <div class="text-sm opacity-90">היום</div>
        <div class="text-3xl font-bold mt-2" id="stat-today">0</div>
      </div>
    </div>

    <!-- Chart -->
    <div class="bg-white rounded-xl shadow p-6">
      <h2 class="text-xl font-bold text-gray-900 mb-4">📈 פעילות בשעות האחרונות</h2>
      <canvas id="activityChart" height="80"></canvas>
    </div>

    <!-- Search & Filter -->
    <div class="bg-white rounded-xl shadow p-6">
      <div class="flex gap-4 flex-wrap mb-4">
        <input 
          type="text" 
          id="searchPhone"
          placeholder="🔍 חפש לפי מספר טלפון..."
          class="flex-1 min-w-64 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          onkeyup="filterLogs()"
        >
        <select 
          id="filterStatus"
          onchange="filterLogs()"
          class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">הכל</option>
          <option value="success">הצלחות בלבד</option>
          <option value="failed">כשלונות בלבד</option>
        </select>
        <button 
          onclick="refreshLogs()"
          class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg transition font-medium"
        >
          🔄 רענן
        </button>
      </div>
    </div>

    <!-- Logs Table -->
    <div class="bg-white rounded-xl shadow overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-200">
        <h2 class="text-xl font-bold text-gray-900">📝 רשימת כל הנסיונות</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-100 border-b border-gray-200">
            <tr>
              <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">מספר טלפון</th>
              <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">תאריך וזמן</th>
              <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">סטטוס</th>
              <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">סיבה</th>
              <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">הודעות</th>
            </tr>
          </thead>
          <tbody id="logsTableBody">
            <tr class="text-center text-gray-500 py-8">
              <td colspan="5" class="py-8">⏳ טוען נתונים...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- Auth Modal -->
<div id="authModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" style="display: none;">
  <div class="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full mx-4">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">🔐 כניסה למנהל</h2>
    <p class="text-gray-600 mb-6">הזן את מספר הטלפון של המנהל</p>
    <input 
      type="text"
      id="adminPin"
      placeholder="0548548689"
      inputmode="tel"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
      onkeypress="if(event.key==='Enter') loginAdmin()"
    >
    <button 
      onclick="loginAdmin()"
      class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition"
    >
      כניסה
    </button>
  </div>
</div>

<script>
let allLogs = [];
let chartInstance = null;

// בדוק אם המנהל מחובר
function checkAuth() {
  // בדוק אם יש PIN בURL (מהכפתור)
  const urlParams = new URLSearchParams(window.location.search);
  const pinFromUrl = urlParams.get('pin');
  
  if (pinFromUrl) {
    // נסה כניסה עם ה-PIN מה-URL
    sessionStorage.setItem('adminAuth', pinFromUrl);
    localStorage.setItem('adminAuth', pinFromUrl);
    return true;
  }
  
  const auth = sessionStorage.getItem('adminAuth') || localStorage.getItem('adminAuth');
  if (!auth) {
    document.getElementById('authModal').style.display = 'flex';
    return false;
  }
  
  sessionStorage.setItem('adminAuth', auth);
  return true;
}

// כניסה
async function loginAdmin() {
  const phone = document.getElementById('adminPin').value;
  
  if (!phone) {
    alert('הזן מספר טלפון');
    return;
  }

  try {
    const response = await fetch(`/api/admin-logs?adminPhone=${encodeURIComponent(phone)}`);
    if (response.ok) {
      sessionStorage.setItem('adminAuth', phone);
      localStorage.setItem('adminAuth', phone);
      document.getElementById('authModal').style.display = 'none';
      await refreshLogs();
    } else {
      alert('❌ מספר טלפון לא מורשה');
    }
  } catch (err) {
    alert('שגיאה בחיבור לשרת: ' + err.message);
  }
}

// התנתקות
function logout() {
  localStorage.removeItem('adminAuth');
  sessionStorage.removeItem('adminAuth');
  location.reload();
}

// שליפת לוגים
async function refreshLogs() {
  const phone = sessionStorage.getItem('adminAuth') || localStorage.getItem('adminAuth');
  if (!phone) return;

  try {
    const response = await fetch(`/api/admin-logs?adminPhone=${encodeURIComponent(phone)}`);
    const data = await response.json();

    if (data.ok) {
      allLogs = data.logs;
      updateStats(data.stats);
      renderLogs(allLogs);
      updateChart(allLogs);
    }
  } catch (err) {
    console.error('Error fetching logs:', err);
  }
}

// עדכון סטטיסטיקה
function updateStats(stats) {
  document.getElementById('stat-total').textContent = stats.total;
  document.getElementById('stat-success').textContent = stats.successful;
  document.getElementById('stat-failed').textContent = stats.failed;
  document.getElementById('stat-unique').textContent = stats.unique_phones;
  document.getElementById('stat-today').textContent = stats.today;
}

// הדפסת לוגים
function renderLogs(logs) {
  const tbody = document.getElementById('logsTableBody');
  
  if (logs.length === 0) {
    tbody.innerHTML = '<tr class="text-center text-gray-500"><td colspan="5" class="py-8">אין נתונים עדיין</td></tr>';
    return;
  }

  tbody.innerHTML = logs.map(log => `
    <tr class="log-row border-b border-gray-200">
      <td class="px-6 py-4 font-medium text-gray-900 text-lg">${log.phone}</td>
      <td class="px-6 py-4 text-gray-600">
        <div class="text-sm">${log.date}</div>
        <div class="text-xs text-gray-400">${log.time}</div>
      </td>
      <td class="px-6 py-4">
        ${log.success 
          ? '<span class="badge-success">✓ הצלחה</span>' 
          : '<span class="badge-error">✗ כשל</span>'}
      </td>
      <td class="px-6 py-4 text-gray-600 text-sm">${log.reason}</td>
      <td class="px-6 py-4 text-center font-bold text-blue-600">${log.messages_count || '-'}</td>
    </tr>
  `).join('');
}

// סינון לוגים
function filterLogs() {
  const phone = document.getElementById('searchPhone').value.toLowerCase();
  const status = document.getElementById('filterStatus').value;

  let filtered = allLogs;

  if (phone) {
    filtered = filtered.filter(log => log.phone.includes(phone));
  }

  if (status === 'success') {
    filtered = filtered.filter(log => log.success);
  } else if (status === 'failed') {
    filtered = filtered.filter(log => !log.success);
  }

  renderLogs(filtered);
}

// עדכון גרף
function updateChart(logs) {
  const hours = {};
  const now = new Date();

  // אתחול 24 שעות אחרונות
  for (let i = 23; i >= 0; i--) {
    const d = new Date(now);
    d.setHours(d.getHours() - i);
    const hour = d.getHours().toString().padStart(2, '0') + ':00';
    hours[hour] = 0;
  }

  // ספור לפי שעה
  logs.forEach(log => {
    const time = new Date(log.timestamp);
    const hour = time.getHours().toString().padStart(2, '0') + ':00';
    if (hours.hasOwnProperty(hour)) {
      hours[hour]++;
    }
  });

  const labels = Object.keys(hours);
  const data = Object.values(hours);

  if (chartInstance) {
    chartInstance.data.labels = labels;
    chartInstance.data.datasets[0].data = data;
    chartInstance.update();
  } else {
    const ctx = document.getElementById('activityChart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'מספר נסיונות',
          data,
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          borderWidth: 2,
          fill: true,
          tension: 0.4,
          pointRadius: 4,
          pointBackgroundColor: '#3b82f6',
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { display: true, labels: { usePointStyle: true } } },
        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
      }
    });
  }
}

// עדכון אוטומטי כל 30 שניות
setInterval(() => {
  if (localStorage.getItem('adminAuth')) {
    refreshLogs();
  }
}, 30000);

// בדיקה התחלתית
if (checkAuth()) {
  refreshLogs();
}
</script>

</body>
</html>
